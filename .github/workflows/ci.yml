name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only reads the code; grant more per job if a step ever needs it.
permissions:
  contents: read

# A new push to the same PR cancels the older run; pushes to main always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tags can be moved); the comment names the release.
jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version`: pnpm is read from package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Keep in sync with the postgres image in compose.yaml.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtm
          POSTGRES_DB: gtm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Vitest global setup creates and migrates this database.
      TEST_DATABASE_URL: postgres://gtm:gtm@localhost:5432/gtm_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

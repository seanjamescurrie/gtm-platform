# Local development infrastructure. Start with `docker compose up -d --wait`.
# Reset all data with `docker compose down -v`.
# Ports bind to 127.0.0.1 so these dev-credential services are not reachable from the network.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm}
      POSTGRES_DB: ${POSTGRES_DB:-gtm}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (Redis fork, same protocol) to match ElastiCache for Valkey in production.
  redis:
    image: valkey/valkey:8.1.10-alpine
    # noeviction: BullMQ stores jobs as keys; evicting them under memory pressure silently loses jobs.
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal CLI dev server: single process, SQLite storage, web UI built in. Temporal Cloud replaces it in production.
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/home/temporal/temporal.db']
    ports:
      - '127.0.0.1:${TEMPORAL_PORT:-7233}:7233'
      - '127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233'
    volumes:
      # Mounted over the image user's home so the new volume is owned by the non-root `temporal` user.
      - temporaldata:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  temporaldata:
